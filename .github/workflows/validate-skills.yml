name: Validate Skills

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate skill repo
        run: python3 scripts/validate_skills.py

      - name: Test distribution tools
        run: python3 -m unittest discover -s tests -v

      - name: Test Brand Harvester network safety
        run: python3 -m unittest discover -s Skills/brand-harvester/tests -v

      - name: Scan public release surface
        run: python3 scripts/scan_public_release.py
