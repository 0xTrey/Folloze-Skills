interface:
  display_name: "Folloze One-Pager"
  short_description: "Build an approved AE or SDR Folloze prospect one-pager"
  default_prompt: "Use $folloze-one-pager in two stages. First choose the adaptive lane: synthesize authorized deal context for an AE active deal, or use public research plus rep-approved hypotheses for an SDR net-new prospect. Approve a brief with one buyer challenge, one desired outcome, exact claim and proof wording, and the role-specific CTA. Then build a short-scroll, white-paper-style Folloze microsite with Hero, Desired outcome, Folloze capabilities, Proof, and CTA. Keep local preview, MCP save, AE-only public deployment, manual link sharing, and PDF output as separate approvals and states."
