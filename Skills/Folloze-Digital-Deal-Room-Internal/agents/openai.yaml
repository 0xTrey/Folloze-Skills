interface:
  display_name: "Folloze Digital Deal Room Internal"
  short_description: "Build Folloze deal rooms from the July 2026 native template"
  default_prompt: "Use $folloze-digital-deal-room-internal for a manually invoked deal-room build. Target 5-8 minutes and enforce a hard 10-minute ceiling. Run the complete concurrent preflight before any board mutation; stop within 60 seconds on missing auth, editor-invite readiness, or required source access instead of debugging during production. For Trey, use the matching Granola meeting first; for Luke, inspect the supplied Kaia transcript/video package first. Copy Board 248623 through the direct API. Keep Build Speed & Scalability, Personalization & Enrichment, and Analytics & Optimization; use Openness & AI Connectivity only when the call supports an external-AI use case, otherwise use Operational Scale & Reuse. Perform and verify real opening-chatter clipping. Pull demo example destinations from the MCP Demo Environments Google Sheet and preview tiles from the Folloze General shared Drive tile library. Add the real deck and processed recording, preserve the baseline example boards, and leave the ROI calculator untouched. Use one bounded verifier and return stage timing, token-usage availability, and defensible cost evidence. Do not use MCP Save, rebuild the approved embedded HTML sections, inspect app bundles/source maps, or discover endpoints during the production clock."
