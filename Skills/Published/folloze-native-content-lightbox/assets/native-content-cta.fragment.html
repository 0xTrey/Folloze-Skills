<style>
.fz-native-content-lightbox-cta { padding: 24px; }
.fz-native-content-lightbox-cta__button { display: inline-flex; align-items: center; min-height: 44px; padding: 10px 16px; border: 0; border-radius: 4px; background: #087b16; color: #fff; font: 700 16px/1.3 Arial, sans-serif; cursor: pointer; }
.fz-native-content-lightbox-cta__button:focus-visible { outline: 3px solid #1744c2; outline-offset: 3px; }
.fz-native-content-lightbox-cta__button:disabled { background: #748076; cursor: not-allowed; }
</style>
<section class="fz-native-content-lightbox-cta" data-board-url="https://target-board.example/board-path">
  <button class="fz-native-content-lightbox-cta__button" type="button" data-item-url="https://target-board.example/board-path/items/verified-item-path">Open content item</button>
</section>
<script>
(() => {
  const root = document.querySelector('.fz-native-content-lightbox-cta');
  if (!root) return;
  const cleanPath = path => path.replace(/\/$/, '');
  let board;
  try { board = new URL(root.dataset.boardUrl); }
  catch { return; }
  const boardPath = cleanPath(board.pathname);
  const boardKey = 'fz-native-lightbox-scroll:' + board.origin + ':' + boardPath;
  const onBoard = () => location.origin === board.origin && cleanPath(location.pathname) === boardPath;
  const isBoardItem = url => url.origin === board.origin && url.pathname.startsWith(boardPath + '/items/');
  const launchers = [...root.querySelectorAll('[data-item-url]')];
  const itemUrlFor = launcher => {
    try {
      const url = new URL(launcher.dataset.itemUrl);
      return isBoardItem(url) ? url : null;
    } catch { return null; }
  };
  launchers.forEach(launcher => {
    if (!itemUrlFor(launcher) || location.origin !== board.origin) launcher.disabled = true;
  });
  const rememberScroll = () => {
    try {
      const top = document.scrollingElement?.scrollTop ?? window.scrollY;
      sessionStorage.setItem(boardKey, String(Math.max(0, Math.round(top))));
    } catch { /* Native item navigation still works without browser storage. */ }
  };
  const restoreScroll = () => {
    if (!onBoard()) return;
    let saved;
    try { saved = sessionStorage.getItem(boardKey); }
    catch { return; }
    if (saved === null) return;
    const top = Number(saved);
    if (!Number.isSafeInteger(top) || top < 0) return;
    const apply = () => {
      const scroller = document.scrollingElement || document.documentElement;
      const max = Math.max(0, scroller.scrollHeight - window.innerHeight);
      window.scrollTo(0, Math.min(top, max));
      try { sessionStorage.removeItem(boardKey); }
      catch { /* The restored position is still usable. */ }
    };
    const schedule = () => requestAnimationFrame(() => requestAnimationFrame(apply));
    if (document.readyState === 'complete') schedule();
    else window.addEventListener('load', schedule, {once: true});
  };
  root.addEventListener('click', event => {
    const launcher = event.target.closest('[data-item-url]');
    if (!launcher || !root.contains(launcher) || launcher.disabled || !onBoard()) return;
    const itemUrl = itemUrlFor(launcher);
    if (!itemUrl) return;
    rememberScroll();
    if (typeof flzAnalytic === 'function') {
      flzAnalytic('folloze_content_item_opened', {text: launcher.textContent.trim(), destination: itemUrl.href}, launcher);
    }
    window.location.assign(itemUrl.href);
  });
  window.addEventListener('popstate', restoreScroll);
  window.addEventListener('pageshow', restoreScroll);
  let lastRoute = location.pathname;
  new MutationObserver(() => {
    if (location.pathname === lastRoute) return;
    lastRoute = location.pathname;
    restoreScroll();
  }).observe(document.body, {childList: true, subtree: true});
  restoreScroll();
})();
</script>
